<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>السبحة الإلكترونية</title>
    <style>
        :root {
            --bg-color: #e5e5e5;
            --marble-color: #f8f9fa;
            --screen-bg: #8ba889;
            --screen-text: #1a2f1c;
            --button-bg: radial-gradient(circle, #ffffff 0%, #d1d5db 100%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        html, body { width: 100%; height: 100vh; height: 100dvh; overflow: hidden; background-color: var(--bg-color); transition: background 0.5s; }
        
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; }

        /* جسم السبحة */
        .tasbih-body {
            background: var(--marble-color);
            border-radius: 45% 45% 35% 35% / 25% 25% 45% 45%;
            padding: 25px 20px;
            box-shadow: 
                inset 0 0 20px rgba(0,0,0,0.1),
                0 15px 35px rgba(0,0,0,0.2),
                0 5px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 380px;
            position: relative;
            transition: background 0.5s;
            margin-bottom: 15px;
        }

        /* شاشة العرض المتناسقة */
        .screen-container {
            background: #111;
            border-radius: 20px;
            padding: 12px;
            width: 100%;
            box-shadow: inset 0 4px 15px rgba(0,0,0,0.8);
            margin-bottom: 25px;
        }

        .screen {
            background: var(--screen-bg);
            border-radius: 12px;
            padding: 15px 10px;
            text-align: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 130px;
        }

        /* خلفية الشاشة لمحاكاة الـ LCD */
        .screen::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.05) 2px, rgba(0,0,0,0.05) 4px);
            pointer-events: none;
        }

        /* تكبير خط الذكر */
        .dhikr-name {
            font-size: clamp(20px, 6vw, 28px);
            color: var(--screen-text);
            font-weight: bold;
            margin-bottom: 10px;
            font-family: 'Traditional Arabic', 'Amiri', serif;
            line-height: 1.3;
            z-index: 2;
        }

        /* تكبير خط العداد */
        .counter-number {
            font-size: clamp(60px, 18vw, 90px);
            font-weight: bold;
            color: var(--screen-text);
            font-family: 'Courier New', Courier, monospace;
            line-height: 1;
            transition: color 0.3s;
            z-index: 2;
        }

        /* أزرار COUNT و RESET المكتوبة على السبحة */
        .labels {
            display: flex;
            justify-content: space-between;
            width: 90%;
            margin-bottom: 25px;
            font-weight: bold;
            color: #555;
            font-size: clamp(14px, 4vw, 18px);
            letter-spacing: 2px;
        }

        /* الزر الكبير للتسبيح */
        .main-btn {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: var(--button-bg);
            border: 5px solid #ccc;
            box-shadow: 
                0 12px 25px rgba(0,0,0,0.3),
                inset 0 -8px 15px rgba(0,0,0,0.1),
                inset 0 8px 15px rgba(255,255,255,0.8);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.1s;
        }

        .main-btn:active {
            transform: translateY(6px) scale(0.97);
            box-shadow: 
                0 6px 12px rgba(0,0,0,0.3),
                inset 0 -3px 10px rgba(0,0,0,0.1),
                inset 0 3px 10px rgba(255,255,255,0.8);
        }

        /* لوحة التحكم والإعدادات */
        .controls {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(255,255,255,0.9);
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .control-row label {
            font-size: 15px;
            font-weight: bold;
            color: #333;
            white-space: nowrap;
        }

        select, input[type="number"] {
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #ddd;
            font-size: 16px;
            font-weight: bold;
            flex: 1;
            background: #fff;
            color: #333;
            outline: none;
        }
        select:focus, input:focus { border-color: #8ba889; }

        .color-picker {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .color-btn {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .color-btn:active { transform: scale(0.9); }

        .reset-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
            transition: background 0.2s;
            box-shadow: 0 4px 10px rgba(239, 68, 68, 0.3);
        }
        .reset-btn:active { background: #dc2626; transform: translateY(2px); }

        /* التجاوب مع الشاشات الصغيرة جداً */
        @media (max-height: 720px) {
            .tasbih-body { padding: 15px; margin-bottom: 10px; }
            .screen-container { margin-bottom: 15px; }
            .screen { min-height: 100px; padding: 10px; }
            .main-btn { width: 120px; height: 120px; }
            .labels { margin-bottom: 15px; }
            .controls { padding: 10px; gap: 8px; }
            .dhikr-name { font-size: 20px; }
            .counter-number { font-size: 50px; }
        }
    </style>
</head>
<body>

    <!-- جسم السبحة -->
    <div class="tasbih-body" id="tasbihBody">
        <!-- الشاشة -->
        <div class="screen-container">
            <div class="screen">
                <div class="dhikr-name" id="dhikrDisplay">سُبْحَانَ اللَّهِ</div>
                <div class="counter-number" id="counterDisplay">0</div>
            </div>
        </div>

        <!-- المسميات -->
        <div class="labels">
            <span>COUNT</span>
            <span>RESET</span>
        </div>

        <!-- الزر الكبير -->
        <button class="main-btn" id="mainCountBtn"></button>
    </div>

    <!-- لوحة التحكم -->
    <div class="controls">
        <div class="control-row">
            <label>الذكر:</label>
            <select id="dhikrSelect" onchange="changeDhikr()">
                <option value="سُبْحَانَ اللَّهِ">سُبْحَانَ اللَّهِ</option>
                <option value="الْحَمْدُ لِلَّهِ">الْحَمْدُ لِلَّهِ</option>
                <option value="اللَّهُ أَكْبَرُ">اللَّهُ أَكْبَرُ</option>
                <option value="لَا إِلَهَ إِلَّا اللَّهُ">لَا إِلَهَ إِلَّا اللَّهُ</option>
                <option value="أَسْتَغْفِرُ اللَّهَ">أَسْتَغْفِرُ اللَّهَ</option>
                <option value="سُبْحَانَ اللَّهِ وَبِحَمْدِهِ">سُبْحَانَ اللَّهِ وَبِحَمْدِهِ</option>
                <option value="سُبْحَانَ اللَّهِ الْعَظِيمِ">سُبْحَانَ اللَّهِ الْعَظِيمِ</option>
                <option value="لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ">لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ</option>
                <option value="اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ">اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ</option>
                <option value="لَا إِلَهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ">لَا إِلَهَ إِلَّا أَنْتَ سُبْحَانَكَ..</option>
                <option value="سُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ وَلَا إِلَهَ إِلَّا اللَّهُ وَاللَّهُ أَكْبَرُ">سُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ..</option>
                <option value="لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ">لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ..</option>
                <option value="أَسْتَغْفِرُ اللَّهَ الْعَظِيمَ وَأَتُوبُ إِلَيْهِ">أَسْتَغْفِرُ اللَّهَ الْعَظِيمَ..</option>
                <option value="اللَّهُمَّ اغْفِرْ لِي وَارْحَمْنِي وَاهْدِنِي وَعَافِنِي وَارْزُقْنِي">اللَّهُمَّ اغْفِرْ لِي وَارْحَمْنِي..</option>
                <option value="حَسْبِيَ اللَّهُ وَنِعْمَ الْوَكِيلُ">حَسْبِيَ اللَّهُ وَنِعْمَ الْوَكِيلُ</option>
            </select>
        </div>

        <div class="control-row">
            <label>تنبيه العداد:</label>
            <input type="number" id="targetInput" value="33" min="1" onchange="updateTarget()">
        </div>

        <div class="control-row">
            <label>لون السبحة:</label>
            <div class="color-picker">
                <button class="color-btn" style="background: #f8f9fa;" onclick="setTheme('#f8f9fa', '#e5e5e5', '#555')"></button> <!-- أبيض -->
                <button class="color-btn" style="background: #2c3e50;" onclick="setTheme('#2c3e50', '#1a252f', '#fff')"></button> <!-- أسود -->
                <button class="color-btn" style="background: #2e7d32;" onclick="setTheme('#2e7d32', '#1b5e20', '#fff')"></button> <!-- أخضر -->
                <button class="color-btn" style="background: #8d6e63;" onclick="setTheme('#8d6e63', '#5d4037', '#fff')"></button> <!-- خشبي -->
            </div>
        </div>

        <div class="control-row">
            <button class="reset-btn" onclick="resetCounter()">تصفير العداد</button>
        </div>
    </div>

    <script>
        let count = 0;
        let target = 33;

        const counterDisplay = document.getElementById('counterDisplay');
        const dhikrDisplay = document.getElementById('dhikrDisplay');
        const dhikrSelect = document.getElementById('dhikrSelect');
        const targetInput = document.getElementById('targetInput');

        // دالة الاهتزاز
        function vibrate() {
            if (navigator.vibrate) {
                navigator.vibrate(40); // اهتزاز لمدة 40 مللي ثانية
            }
        }

        // دالة العد
        function incrementCount() {
            count++;
            updateDisplay();
            vibrate();
        }

        // تحديث الشاشة
        function updateDisplay() {
            counterDisplay.textContent = count;

            // تغيير اللون إذا وصل للهدف (ويظل مستمراً باللون الأحمر)
            if (count >= target) {
                counterDisplay.style.color = '#ef4444'; // أحمر
            } else {
                counterDisplay.style.color = 'var(--screen-text)'; // اللون الافتراضي
            }
        }

        // تصفير العداد
        function resetCounter() {
            count = 0;
            updateDisplay();
            vibrate();
        }

        // تغيير الذكر (مع تصفير العداد تلقائياً)
        function changeDhikr() {
            dhikrDisplay.textContent = dhikrSelect.value;
            resetCounter(); 
        }

        // تحديث حد التنبيه
        function updateTarget() {
            target = parseInt(targetInput.value) || 33;
            updateDisplay();
        }

        // تغيير لون السبحة
        function setTheme(bodyColor, bgColor, labelColor) {
            document.getElementById('tasbihBody').style.setProperty('--marble-color', bodyColor);
            document.body.style.setProperty('--bg-color', bgColor);
            
            // تغيير لون الكلمات COUNT و RESET حسب لون السبحة
            document.querySelectorAll('.labels span').forEach(el => el.style.color = labelColor);
        }

        // ربط الزر
        document.getElementById('mainCountBtn').addEventListener('click', incrementCount);

        // تهيئة أولية
        updateDisplay();
    </script>
</body>
</html>
